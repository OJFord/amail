[package]
name = "amail"
version = "0.0.0"
description = "AMail EML client"
authors = ["Oliver Ford"]
license-file = "../../LICENCE"
repository = "https://github.com/OJFord/amail"
default-run = "amail"
edition = "2024"

[build-dependencies]
tauri-build = { version = "^2.6.2" }
xtask-frontend = { path = "../xtask-frontend" }

[dependencies]
ammonia = "^4.1.2"
anyhow = "^1.0"
notmuch-more = "^0.0.0"
serde_json = "^1.0"
tauri = { version = "^2.11.1" }
tauri-plugin-dialog = "^2.7.1"
tauri-plugin-fs = "^2.4.5"
tauri-plugin-shell = "^2.3.5"
thiserror = "^2.0.18"
whoami = "^2.1.2"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
